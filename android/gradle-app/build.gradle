plugins {
    id 'com.android.application' version '9.5.1'
}

android {
    namespace 'com.bataa.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bataa.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    // Sources stay where the old hand-made build kept them (android/manual); the web app is mobile/dist,
    // and the launcher icons are made from public/applogo.png by scripts/build-android-apk.sh.
    sourceSets {
        main {
            manifest.srcFile '../manual/AndroidManifest.xml'
            java.srcDirs = ['../manual/src']
            res.srcDirs = ['../manual/res', 'build/generated/icons']
            assets.srcDirs = [System.getenv('BATAA_WEB_DIST') ?: '../../mobile/dist']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native "Sign in with Google": Android's Credential Manager and Google's ID token credential.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}
