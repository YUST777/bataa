<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duck Rig Playground</title>
  <!-- Dev playground for public/mascot/duck.riv (built by design/mascot/rig/build_rig.py). Not part of the app. -->
  <style>
    :root { --ink: #1F1611; --line: #EFE6DA; --accent: #FF8A1F; --soft: #FFF1E3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 500 15px/1.4 system-ui, sans-serif; display: grid; justify-items: center; padding: 16px; }
    canvas { width: min(360px, 100%); aspect-ratio: 480 / 500; background: linear-gradient(180deg, #FFC98A, #FFF1DF 70%, #fff); border-radius: 24px; touch-action: none; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; max-width: 360px; }
    button { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font: inherit; font-weight: 600; color: var(--ink); }
    button[aria-pressed='true'] { background: var(--soft); border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    p { color: #7A6A5D; font-size: 13px; text-align: center; max-width: 340px; }
  </style>
</head>
<body>
  <canvas id="duck" width="960" height="1000"></canvas>
  <div class="row">
    <button class="primary" data-fire="wave">Wave</button>
    <button data-fire="isCorrect">Correct</button>
    <button data-fire="isWrong">Wrong</button>
    <button data-fire="dance">Dance</button>
  </div>
  <div class="row">
    <button data-toggle="isSpeaking" aria-pressed="false">Talk</button>
    <button data-toggle="isThinking" aria-pressed="false">Think</button>
    <button data-mouth>Mouth: rest</button>
  </div>
  <p>Move your pointer around: the eyes follow it. Blinks run on their own.</p>
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.49.0/rive.js"></script>
  <script>
    const canvas = document.getElementById('duck')
    const SM = 'Duck'
    const r = new rive.Rive({
      src: '/mascot/duck.riv',
      canvas,
      stateMachines: SM,
      autoplay: true,
      onLoad: () => r.resizeDrawingSurfaceToCanvas(),
    })
    const input = (name) => r.stateMachineInputs(SM).find((i) => i.name === name)

    document.querySelectorAll('[data-fire]').forEach((b) => b.addEventListener('click', () => input(b.dataset.fire).fire()))
    document.querySelectorAll('[data-toggle]').forEach((b) =>
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true'
        b.setAttribute('aria-pressed', on)
        input(b.dataset.toggle).value = on
      }),
    )
    // Steps through the visemes one at a time: 0 rest, 1 A, 2 E, 3 O, 4 M, 5 smile.
    const MOUTHS = ['rest', 'A (wide)', 'E (slight)', 'O (round)', 'M (closed)', 'smile']
    let mouth = 0
    document.querySelector('[data-mouth]').addEventListener('click', (e) => {
      mouth = (mouth + 1) % MOUTHS.length
      input('mouthShape').value = mouth
      e.currentTarget.textContent = `Mouth: ${MOUTHS[mouth]}`
    })
    // Gaze: full deflection about 250px from the duck's face.
    const clamp = (n) => Math.max(-100, Math.min(100, n))
    window.addEventListener('pointermove', (e) => {
      const b = canvas.getBoundingClientRect()
      const fx = b.left + b.width * 0.35, fy = b.top + b.height * 0.3
      input('lookX').value = clamp(((e.clientX - fx) / 250) * 100)
      input('lookY').value = clamp(((e.clientY - fy) / 250) * 100)
    })
  </script>
</body>
</html>
