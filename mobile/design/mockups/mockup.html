<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Three iPhones on a soft gray. Sizes follow an iPhone 15 Pro (393x852 pt) at 1.3x: titanium band, thin black bezel, Dynamic Island. ?s=a,b,c picks the screens from raw/. */
  html,body{margin:0}
  body{width:2000px;height:1520px;background:#EDEBE8;display:flex;justify-content:center;align-items:center;gap:90px;font-family:'SF Pro Display',Inter,system-ui,sans-serif}
  .phone{position:relative;width:545px;height:1135px;border-radius:93px;padding:6px;box-sizing:border-box;
    background:linear-gradient(135deg,#8a8a8f 0%,#3a3a3d 6%,#1c1c1e 18%,#2a2a2d 50%,#1c1c1e 82%,#3a3a3d 94%,#8a8a8f 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 0 2.5px rgba(0,0,0,.6),0 50px 90px -40px rgba(40,30,20,.45),0 18px 30px -18px rgba(40,30,20,.3)}
  .bezel{width:100%;height:100%;border-radius:87px;background:#000;padding:12px;box-sizing:border-box;box-shadow:inset 0 0 0 1px #111}
  .screen{position:relative;width:100%;height:100%;border-radius:75px;overflow:hidden;background:#FFF8F0}
  .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
  .island{position:absolute;top:14px;left:50%;width:164px;height:48px;border-radius:30px;background:#000;transform:translateX(-50%)}
  .island::after{content:'';position:absolute;right:16px;top:50%;width:14px;height:14px;border-radius:50%;transform:translateY(-50%);background:radial-gradient(circle at 40% 40%,#2c3a55,#0b0f18 60%)}
  .bar{position:absolute;top:0;left:0;right:0;height:66px;display:grid;grid-template-columns:1fr 164px 1fr;align-items:center;color:#000;font-weight:600;font-size:22px;letter-spacing:-.3px}
  .bar>span:first-child{justify-self:center;padding-left:18px}
  .icons{justify-self:center;display:flex;gap:7px;align-items:center;padding-right:10px}
  .bar.light{color:#fff}
  .home{position:absolute;bottom:10px;left:50%;width:180px;height:6px;border-radius:9px;background:#000;transform:translateX(-50%)}
  .home.light{background:#fff}
  .btn{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#1a1a1c,#5d5d62 45%,#232326)}
  .btn.l{left:-4px}.btn.r{right:-4px}
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  const shots = q.get('s').split(',')
  const light = (q.get('light') || '').split(',')
  const icons = '<svg width="28" height="18" viewBox="0 0 28 18" fill="currentColor"><rect x="0" y="12" width="5" height="6" rx="1.5"/><rect x="7.5" y="8" width="5" height="10" rx="1.5"/><rect x="15" y="4" width="5" height="14" rx="1.5"/><rect x="22.5" y="0" width="5" height="18" rx="1.5"/></svg><svg width="26" height="18" viewBox="0 0 26 18" fill="currentColor"><path d="M13 3.5c3.6 0 6.9 1.4 9.3 3.7l1.9-2C21.3 2.4 17.3.7 13 .7S4.7 2.4 1.8 5.2l1.9 2C6.1 4.9 9.4 3.5 13 3.5zm0 5.4c2.1 0 4 .8 5.5 2.1l1.9-2C18.4 7.2 15.8 6.1 13 6.1S7.6 7.2 5.6 9l1.9 2c1.5-1.3 3.4-2.1 5.5-2.1zm0 5.3c-.8 0-1.6.3-2.2.8L13 17.3l2.2-2.3c-.6-.5-1.4-.8-2.2-.8z"/></svg><svg width="40" height="19" viewBox="0 0 40 19"><rect x="1" y="1" width="34" height="17" rx="5" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2"/><rect x="4" y="4" width="28" height="11" rx="3" fill="currentColor"/><rect x="37" y="6.5" width="2.5" height="6" rx="1.2" fill="currentColor" fill-opacity=".45"/></svg>'
  for (const s of shots) {
    const l = light.includes(s) ? ' light' : ''
    document.body.insertAdjacentHTML('beforeend', `<div class="phone"><i class="btn l" style="top:190px;height:42px"></i><i class="btn l" style="top:270px;height:80px"></i><i class="btn l" style="top:370px;height:80px"></i><i class="btn r" style="top:300px;height:125px"></i><div class="bezel"><div class="screen"><img src="raw/${s}.png"><div class="island"></div><div class="bar${l}"><span>9:41</span><span></span><span class="icons">${icons}</span></div><div class="home${l}"></div></div></div></div>`)
  }
</script>
</body></html>
