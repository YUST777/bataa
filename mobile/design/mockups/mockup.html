<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Three phones on a soft gray, like a Dribbble shot. ?s=a,b,c picks the screens from raw/. */
  html,body{margin:0}
  body{width:2000px;height:1520px;background:#EDEBE8;display:flex;justify-content:center;align-items:center;gap:73px;font-family:'SF Pro Display',Inter,system-ui,sans-serif}
  .phone{position:relative;width:534px;height:1158px;border-radius:118px;background:#0B0B0B;padding:14px;box-sizing:border-box;box-shadow:0 2px 0 #2a2a2a inset,0 40px 80px -30px rgba(40,30,20,.35)}
  .screen{position:relative;width:100%;height:100%;border-radius:104px;overflow:hidden;background:#FFF8F0}
  .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
  .bar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:6px 46px 0 66px;color:#1F1611;font-weight:600;font-size:24px;letter-spacing:-.2px}
  .bar.light{color:#fff}
  .icons{display:flex;gap:8px;align-items:center}
  .home{position:absolute;bottom:12px;left:50%;width:180px;height:7px;border-radius:9px;background:#1F1611;transform:translateX(-50%)}
  .home.light{background:#fff}
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search)
  const shots = q.get('s').split(',')
  const light = (q.get('light') || '').split(',')
  const icons = '<svg width="28" height="18" viewBox="0 0 28 18" fill="currentColor"><rect x="0" y="12" width="5" height="6" rx="1.5"/><rect x="7.5" y="8" width="5" height="10" rx="1.5"/><rect x="15" y="4" width="5" height="14" rx="1.5"/><rect x="22.5" y="0" width="5" height="18" rx="1.5"/></svg><svg width="26" height="18" viewBox="0 0 26 18" fill="currentColor"><path d="M13 3.5c3.6 0 6.9 1.4 9.3 3.7l1.9-2C21.3 2.4 17.3.7 13 .7S4.7 2.4 1.8 5.2l1.9 2C6.1 4.9 9.4 3.5 13 3.5zm0 5.4c2.1 0 4 .8 5.5 2.1l1.9-2C18.4 7.2 15.8 6.1 13 6.1S7.6 7.2 5.6 9l1.9 2c1.5-1.3 3.4-2.1 5.5-2.1zm0 5.3c-.8 0-1.6.3-2.2.8L13 17.3l2.2-2.3c-.6-.5-1.4-.8-2.2-.8z"/></svg><svg width="40" height="19" viewBox="0 0 40 19"><rect x="1" y="1" width="34" height="17" rx="5" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2"/><rect x="4" y="4" width="28" height="11" rx="3" fill="currentColor"/><rect x="37" y="6.5" width="2.5" height="6" rx="1.2" fill="currentColor" fill-opacity=".45"/></svg>'
  for (const s of shots) {
    const l = light.includes(s) ? ' light' : ''
    document.body.insertAdjacentHTML('beforeend', `<div class="phone"><div class="screen"><img src="raw/${s}.png"><div class="bar${l}"><span>9:41</span><span class="icons">${icons}</span></div><div class="home${l}"></div></div></div>`)
  }
</script>
</body></html>
