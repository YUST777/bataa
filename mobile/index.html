<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFD3A0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bataa — learn to code by doing</title>
    <!-- Boot skeleton: plain CSS, because the app's styles arrive with its script. React replaces it on mount. -->
    <style>
      body { margin: 0; background: #fff; }
      .boot { max-width: 448px; margin: 0 auto; min-height: 100dvh; padding-top: var(--sat, env(safe-area-inset-top, 0px)); }
      .boot-sky { background: linear-gradient(180deg, #FFC98A 0%, #FFE0BA 55%, #FFF1DF 100%); padding: 20px 20px 44px; border-radius: 0 0 28px 28px; }
      .boot-row { display: flex; align-items: center; gap: 8px; }
      .boot i { display: block; border-radius: 999px; background: linear-gradient(100deg, rgba(255,255,255,.5) 40%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.5) 60%) 0 0 / 300% 100%; animation: boot-sheen 1.4s linear infinite; }
      .boot-body i { background-image: linear-gradient(100deg, #F4ECE2 40%, #FBF6F0 50%, #F4ECE2 60%); }
      .boot-body { padding: 24px 16px; }
      .boot-card { border: 1px solid #EFE6DA; border-radius: 20px; padding: 16px; }
      .boot-node { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 32px; }
      .boot-tabs { position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--sab, env(safe-area-inset-bottom, 0px))); max-width: 424px; margin: 0 auto; height: 68px; border: 1px solid #EFE6DA; border-radius: 28px; background: #fff; }
      @keyframes boot-sheen { to { background-position: -150% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
      /* Splash: the duck floats on a pool of water under the app's warm sky, wakes up, then the water drains away. */
      #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; touch-action: none;
        background: linear-gradient(180deg, #FFC98A 0%, #FFE0BA 55%, #FFF1DF 100%); }
      #splash svg.water { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .duck { position: absolute; left: 0; top: 0; width: 132px; will-change: transform; }
      #splash .duck svg { display: block; width: 100%; height: auto; overflow: visible; }
      #splash .eye { transform-box: fill-box; transform-origin: center; transform: scaleY(0.12); }
    </style>
  </head>

    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading">
        <div class="boot-sky">
          <div class="boot-row"><i style="width:84px;height:28px;margin-inline-end:auto"></i><i style="width:56px;height:40px"></i><i style="width:64px;height:40px"></i></div>

            <i style="width:72px;height:72px"></i>
          </div>
        </div>
        <div class="boot-body">

          <div class="boot-node" style="transform:translateX(56px)"><i style="width:64px;height:64px"></i><i style="width:120px;height:14px"></i></div>
          <div class="boot-node"><i style="width:76px;height:76px"></i><i style="width:130px;height:14px"></i></div>
        </div>
        <div class="boot-tabs"></div>
      </div>
    </div>

      <svg class="water front"><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB466" /><stop offset="1" stop-color="#F47A0C" /></linearGradient></defs>
        <path class="sea" fill="url(#sea)" /><path class="foam" fill="none" stroke="#FFF6EA" stroke-opacity=".85" stroke-width="3" stroke-linecap="round" /><g class="fx" fill="none" stroke="#FFF6EA" stroke-width="2.5"></g><g class="drops" fill="#FFE6C7"></g></svg>
    </div>
    <script>
      // Splash. Runs before the app's script loads, so it shows from the very first frame.
      // A warm sunset pond under the app's own sky (Bataa has no blues, so the water reflects the orange).
      // The duck pops up out of the water with a splash and ripples, floats bobbing on two layers of waves,
      // wakes (eyes open, a blink), then the water drains away down the screen with the duck riding it, and
      // the sky fades into the app's own. Tap skips to the drain. Plays in full even with reduced motion:
      // it is a two-second brand moment.
      (function () {
        var root = document.getElementById('splash')
        var back = root.querySelector('.back path'), sea = root.querySelector('.sea'), foam = root.querySelector('.foam')
        var duck = root.querySelector('.duck'), eyes = root.querySelectorAll('.eye')
        var W = innerWidth, H = innerHeight
        root.querySelectorAll('svg.water').forEach(function (s) { s.setAttribute('viewBox', '0 0 ' + W + ' ' + H) })
        var DUCK_W = 132, DUCK_H = 132 * 40 / 32, WATERLINE = 0.7 // share of the duck's height above the water
        var WAKE = 1600, DRAIN = 950
        var POP = 140, POP_LEN = 560 // the duck bursts up through the surface
        var svgNS = 'http://www.w3.org/2000/svg', fx = root.querySelector('.fx'), dropsG = root.querySelector('.drops')
        var rings = [0, 200].map(function (delay) { var e = document.createElementNS(svgNS, 'ellipse'); fx.appendChild(e); return { delay: delay, el: e } })
        // Splash drops: horizontal speed, launch speed (px/s), radius.
        var drops = [[-150, 520, 5], [-90, 640, 4], [-40, 700, 3], [40, 680, 4], [100, 600, 5], [160, 500, 3], [-200, 420, 3], [210, 440, 4]].map(function (d) {
          var c = document.createElementNS(svgNS, 'circle'); c.setAttribute('r', d[2]); dropsG.appendChild(c); return { vx: d[0], vy: d[1], el: c }
        })
        var t0 = performance.now(), skip = 0
        root.addEventListener('pointerdown', function () { if (!skip) skip = performance.now() - t0 })
        function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x }
        function back_(x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
        function eyesTo(v) { for (var i = 0; i < eyes.length; i++) eyes[i].style.transform = 'scaleY(' + v + ')' }
        // Two waves on top of each other, so the surface never looks like a plain sine.
        function wave(x, t, a, phase) { return a * Math.sin(x / W * 2 * Math.PI * 1.2 + t * 2.2 + phase) + a * 0.45 * Math.sin(x / W * 2 * Math.PI * 2.7 - t * 3.1 + phase) }
        function surface(level, t, a, phase) {
          var d = 'M0 ' + H
          for (var x = 0; x <= W + 8; x += 8) d += ' L' + x + ' ' + (level + wave(x, t, a, phase)).toFixed(1)
          return d
        }
        function frame(now) {
          var t = now - t0, s = t / 1000
          var start = skip ? Math.min(WAKE, skip) : WAKE
          if (!skip || t < skip) {
            if (t < 750) eyesTo(0.12)
            else if (t < 1000) eyesTo(0.12 + 0.88 * back_(clamp((t - 750) / 250)))
            else if (t > 1280 && t < 1410) eyesTo(1 - 0.88 * Math.sin(Math.PI * (t - 1280) / 130))
            else eyesTo(1)
          } else eyesTo(1)
          // The water drains with gravity: slow to start, then falls away.
          var p = clamp((t - start) / DRAIN), fall = p * p * p
          var level = H * 0.6 + (H * 0.4 + DUCK_H) * fall
          var bP = surface(level - 10, s, 9, 1.4), fP = surface(level, s, 7, 0)
          back.setAttribute('d', bP + ' L' + (W + 8) + ' ' + H + ' Z')
          sea.setAttribute('d', fP + ' L' + (W + 8) + ' ' + H + ' Z')
          foam.setAttribute('d', 'M' + fP.slice(fP.indexOf('L') + 1))
          // The duck sits on the surface at the middle, tilting with its slope.
          var cx = W / 2, y = level + wave(cx, s, 7, 0), slope = (wave(cx + 12, s, 7, 0) - wave(cx - 12, s, 7, 0)) / 24
          var bob = Math.sin(s * 3.4) * 2
          // Starts under the water and pops up, overshooting a little before it settles to float.
          var under = (1 - back_(clamp((t - POP) / POP_LEN))) * DUCK_H * 0.8
          duck.style.transform = 'translate(' + (cx - DUCK_W / 2) + 'px,' + (y - DUCK_H * WATERLINE + bob + under) + 'px) rotate(' + (Math.atan(slope) * 57 * 0.7) + 'deg)'
          // Ripples spread from where it broke the surface, and drops arc up and fall back in.
          var burst = t - POP - 120
          rings.forEach(function (r) {
            var q = clamp((burst - r.delay) / 900), rx = 24 + W * 0.42 * (1 - Math.pow(1 - q, 3))
            r.el.setAttribute('cx', cx); r.el.setAttribute('cy', level + 2)
            r.el.setAttribute('rx', rx); r.el.setAttribute('ry', rx * 0.16)
            r.el.setAttribute('stroke-opacity', burst < r.delay ? 0 : 0.9 * (1 - q))
          })
          drops.forEach(function (d) {
            var dt = burst / 1000, h = d.vy * dt - 1300 * dt * dt
            d.el.setAttribute('cx', cx + d.vx * dt); d.el.setAttribute('cy', level - h)
            d.el.setAttribute('opacity', burst > 0 && h > 0 ? 1 : 0)
          })
          root.style.opacity = String(1 - clamp((t - start - DRAIN * 0.35) / (DRAIN * 0.65)))
          if (p >= 1) return root.remove()
          requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)
      })()
    </script>
